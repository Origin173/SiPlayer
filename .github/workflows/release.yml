name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v0.1.0-alpha.1
        required: true
        type: string
      source_run_id:
        description: GitHub Actions run ID that contains the uploaded release artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate and package JavaScript release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_PUBLIC_GATEWAY_URL }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and package versions
        run: node scripts/release/validate-tag.mjs

      - name: Run release quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Validate public Gateway configuration
        run: node scripts/release/validate-public-config.mjs

      - name: Build Gateway and Expo export
        run: pnpm build

      - name: Generate release notes
        run: node scripts/release/generate-changelog.mjs --tag "$RELEASE_TAG" --output release-notes.md

      - name: Package JavaScript release artifacts
        run: node scripts/release/package-artifacts.mjs

      - name: Upload JavaScript release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.ref_name }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  native-build:
    name: Build ${{ matrix.platform }} binary locally
    if: github.event_name == 'push'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            extension: apk

          # iOS local build migration is ready but intentionally disabled.
          # Enable only after Apple Developer signing credentials are configured.
          # - platform: ios
          #   runner: macos-26
          #   extension: ipa

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_PUBLIC_GATEWAY_URL }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Setup Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK dependencies
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Select Xcode 26.6
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version

      - name: Verify iOS native build tools
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          ruby --version
          pod --version
          fastlane --version

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.7.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure EAS local build working directory
        shell: bash
        run: echo "EAS_LOCAL_BUILD_WORKINGDIR=${RUNNER_TEMP}/eas-local-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Validate native build inputs
        shell: bash
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "::error::Missing EXPO_TOKEN GitHub Secret"
            exit 1
          fi
          if [[ -z "${EXPO_PROJECT_ID:-}" ]]; then
            echo "::error::Missing EXPO_PROJECT_ID GitHub Variable"
            exit 1
          fi
          if [[ -z "${EXPO_PUBLIC_GATEWAY_URL:-}" ]]; then
            echo "::error::Missing EXPO_PUBLIC_GATEWAY_URL GitHub Variable"
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_GATEWAY_URL" != https://* ]]; then
            echo "::error::EXPO_PUBLIC_GATEWAY_URL must use HTTPS for release builds"
            exit 1
          fi

      - name: Validate EAS project configuration
        working-directory: apps/mobile
        run: eas config --platform "${{ matrix.platform }}" --profile release --non-interactive

      - name: Build signed native binary locally
        working-directory: apps/mobile
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          output="$GITHUB_WORKSPACE/release-artifacts/siplayer-${RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.extension }}"

          eas build \
            --platform "${{ matrix.platform }}" \
            --profile release \
            --local \
            --non-interactive \
            --output "$output"
          test -s "$output"

      - name: List native release artifact
        shell: bash
        run: |
          ls -lh release-artifacts
          test -n "$(find release-artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release with native binaries
    if: github.event_name == 'push'
    needs: [quality, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tagged source for release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download JavaScript release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: release-artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ github.ref_name }}
          path: .

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        run: |
          title="SiPlayer ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md --prerelease release-artifacts/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md release-artifacts/*
          fi

  update-changelog:
    name: Update repository changelog
    needs: publish
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate changelog entry
        run: node scripts/release/generate-changelog.mjs --tag "$RELEASE_TAG" --changelog CHANGELOG.md --update

      - name: Commit changelog update
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  republish-existing:
    name: Republish existing release artifacts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout existing release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Download JavaScript artifacts from source run
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ inputs.release_tag }}
          path: release-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download release notes from source run
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ inputs.release_tag }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download native artifacts from source run
        uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ inputs.release_tag }}
          path: release-artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify existing release artifacts
        shell: bash
        run: |
          test -s release-notes.md
          test -n "$(find release-artifacts -type f -print -quit)"
          find release-artifacts -maxdepth 1 -type f -printf '%f\n'

      - name: Create or update GitHub Release from existing artifacts
        shell: bash
        run: |
          title="SiPlayer ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md --prerelease release-artifacts/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md release-artifacts/*
          fi

      - name: Checkout default branch for changelog update
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate changelog entry from existing release
        run: node scripts/release/generate-changelog.mjs --tag "$RELEASE_TAG" --changelog CHANGELOG.md --update

      - name: Commit changelog update
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${RELEASE_TAG}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
