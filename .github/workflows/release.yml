name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and package versions
        run: node scripts/release/validate-tag.mjs

      - name: Run release quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build Gateway and Mobile exports
        run: pnpm build

      - name: Generate release notes
        run: node scripts/release/generate-changelog.mjs --tag "$RELEASE_TAG" --output release-notes.md

      - name: Package release artifacts
        run: node scripts/release/package-artifacts.mjs

      - name: Create or update GitHub Release
        shell: bash
        run: |
          title="SiPlayer ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md --prerelease release-artifacts/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file release-notes.md release-artifacts/*
          fi

  update-changelog:
    name: Update repository changelog
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate changelog entry
        run: node scripts/release/generate-changelog.mjs --tag "$RELEASE_TAG" --changelog CHANGELOG.md --update

      - name: Commit changelog update
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
